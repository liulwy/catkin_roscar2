#TebLocalPlanner官方介绍：http://wiki.ros.org/teb_local_planner

#局部路径规划器DWAPlannerROS命名空间
TebLocalPlannerROS:
  odom_topic: odom #订阅的里程计话题
  map_frame: map #代价地图的TF参考坐标系

  #机器人参数
  max_vel_x: 0.3 #最大x前向速度，单位：m/s
  max_vel_y: 0.0 #最大y前向速度，单位：m/s，非全向移动小车需要设置为0
  max_vel_x_backwards: 0.5 #最大后退速度，单位：m/s
  max_vel_theta: 1.5  #最大转向角速度，单位：rad/s
  acc_lim_x: 0.2  #最大x向加速度，单位：m/s^2
  acc_lim_y: 0.0  #最大y向加速度，，单位：m/s^2,非全向移动小车需要设置为0
  acc_lim_theta: 0.3  #最大角加速度，单位：rad/s^2

  #阿克曼小车参数，非阿克曼小车设置为0
  min_turning_radius: 0 #机器人最小转弯半径
  wheelbase: 0.322 #机器人轴距，前轮与后轮的距离  0
  cmd_angle_instead_rotvel: False #true则cmd_vel/angular/z内的数据是舵机角度
                                  #无论是不是阿克曼小车都设置为false，因为我们的阿克曼机器人内部进行了速度转换

  #用于局部路径规划的机器人外形
  #机器人外形的类型可以为：point、circular、two_circles、line、polygon，默认为point类型
  footprint_model:    
    #type: point #point类型不需要设置其它参数

    #type: circular #圆形类型，需要设置圆的半径
    #radius: 0.3

    #type: two_circles #两个圆类型，需要设置两个圆的位置和半径
    #front_offset: 0.2 #前面的圆的位置，相对机器人中心
    #front_rasius: 0.2 #前面的圆的半径
    #rear_offset : 0.2 #后面的圆的位置，相对机器人中心
    #rear_rasius : 0.2 #前面的圆的半径

    #type: line #两条线类型，需要设置两条线的位置
    #line_start: [0.00, 0.0]
    #line_end: [0.7, 0.0]
    
    #type: polygon #多边形类型，需要设置各顶点的坐标值
    #vertices: [[-0.133, -0.125],[-0.133, 0.125],[0.133,0.125],[0.133, -0.125]]

    type: polygon
    vertices: [[-0.09, -0.185], [-0.09, 0.185], [0.4,0.185],  [0.4, -0.185]]   #机器人形状 for senior_akm

  # ===== 障碍物参数 =====
  min_obstacle_dist: 0.1           # 与障碍物的最小允许距离，直接影响避障效果，单位：m
  include_costmap_obstacles: True  # 是否将 costmap 中的障碍物纳入轨迹优化约束
  costmap_obstacles_behind_robot_dist: 1.5  # 机器人后方多远的 costmap 障碍物被纳入规划，单位：m
  obstacle_poses_affected: 15      # 每个障碍物影响的轨迹位姿数，范围 0~30
  costmap_converter_plugin: ""     # costmap 转换插件名称，空字符串则使用默认转换
  costmap_converter_spin_thread: True  # costmap 转换是否在独立线程中运行
  costmap_converter_rate: 5        # costmap 转换的处理频率，单位：Hz
  include_dynamic_obstacles: True  # 是否将动态障碍物（如行人雷达数据）纳入规划
  dynamic_obstacle_inflation_dist: 0.6  # 动态障碍物的膨胀距离，单位：m

  #目标点误差允许值
  xy_goal_tolerance: 0.2  #机器人到达目标点时附近时的弧度偏差允许量，在该偏差内认为已经到达目标点，单位为：m
  yaw_goal_tolerance: 0.1 #机器人到达目标点时附近时的弧度偏差允许量，在该偏差内认为已经到达目标点单位为：rad
  free_goal_vel: False    #允许机器人以最大速度驶向目的地

  #轨道配置参数
  teb_autosize: True #优化期间允许改变轨迹的时域长度
  dt_ref: 0.45 #局部路径规划的解析度# minimum 0.01
  dt_hysteresis: 0.1 #允许改变的时域解析度的浮动范围， 一般为 dt_ref 的 10% 左右 minimum0.002
  global_plan_overwrite_orientation: False #覆盖全局路径中局部路径点的朝向
  max_global_plan_lookahead_dist: 3.0 #考虑优化的全局计划子集的最大长度
  feasibility_check_no_poses: 5 #检测位姿可到达的时间间隔 minimum 0

  # ===== 轨迹优化参数 =====
  # G2O 图优化求解器迭代次数
  no_inner_iterations: 5       # 内层迭代次数（每次求解器调用内的迭代）
  no_outer_iterations: 4       # 外层迭代次数（重新初始化轨迹的轮数）
  optimization_activate: True   # 是否启用轨迹优化
  optimization_verbose: False   # 是否输出优化过程的详细日志
  penalty_epsilon: 0.1          # 惩罚项的小量偏移，避免除数过零
  obstacle_cost_exponent: 4     # 障碍物代价的指数系数，越大越远离障碍物

  # --- 速度与加速度约束权重 ---
  weight_max_vel_x: 2           # 最大x向线速度约束权重
  weight_max_vel_theta: 1       # 最大角速度约束权重
  weight_acc_lim_x: 1           # x向加速度限制约束权重
  weight_acc_lim_theta: 1       # 角加速度限制约束权重

  # --- 运动学约束权重 ---
  # 【关键】weight_kinematics_nh 是非完整约束权重。全向轮小车应设较小值(1)，
  # 阿克曼小车需设较大值(1000)，否则 TEB 会为了避障违反阿克曼约束。
  weight_kinematics_nh: 1000         # 非完整运动学约束权重（全向轮→1，阿克曼→1000）
  weight_kinematics_forward_drive: 1 # 前向驱动偏好权重（全向轮→0）
  weight_kinematics_turning_radius: 1 # 最小转弯半径约束权重（全向轮→0）

  # --- 路径质量权重 ---
  weight_optimaltime: 1        # 最优时间权重，必须大于0，越大越追求快速到达
  weight_shortest_path: 0      # 最短路径权重，与 optimaltime 互斥，一般设为0
  weight_obstacle: 100         # 障碍物避让权重，越大离障碍物越远
  weight_inflation: 0.2        # 膨胀层代价权重
  weight_dynamic_obstacle: 10  # 动态障碍物避让权重
  weight_dynamic_obstacle_inflation: 0.2  # 动态障碍物膨胀代价权重
  weight_viapoint: 1           # 途经点约束权重（用于 homotopy class planning）
  weight_adapt_factor: 2       # 自适应权重因子，迭代中动态调整权重时的缩放系数

  # ===== 同伦类并行规划（Homotopy Class Planning）=====
  # 启用后 TEB 会在不同拓扑路径中并行搜索，适合多障碍物复杂环境，
  # 但计算开销较大，简单环境建议关闭。
  enable_homotopy_class_planning: False  # 是否启用同伦类规划
  enable_multithreading: True            # 是否启用多线程并行优化不同拓扑的轨迹
  max_number_classes: 4                  # 最多保留多少个不同的同伦类
  selection_cost_hysteresis: 1.0         # 选择最优轨迹时的代价迟滞阈值
  selection_prefer_initial_plan: 0.95    # 偏好初始已选轨迹的权重（避免频繁切换）
  selection_obst_cost_scale: 1.0         # 选择时障碍物代价的缩放系数
  selection_alternative_time_cost: False # 是否在选择时考虑备选轨迹的时间代价
  roadmap_graph_no_samples: 15           # 路标图采样点数
  roadmap_graph_area_width: 5            # 路标图区域宽度，单位：m
  roadmap_graph_area_length_scale: 1.0   # 路标图区域长度缩放系数
  h_signature_prescaler: 0.5             # H-signature 预缩放系数
  h_signature_threshold: 0.1             # H-signature 区分阈值
  obstacle_heading_threshold: 0.45       # 障碍物朝向变化阈值
  switching_blocking_period: 0.0         # 切换轨迹后的阻塞时间，防止频繁切换
  viapoints_all_candidates: True         # 是否所有候选轨迹都使用途径点
  delete_detours_backwards: True         # 是否删除往反方向绕路的候选轨迹
  max_ratio_detours_duration_best_duration: 3.0  # 绕路轨迹时长与最优时长的最大比值
  visualize_hc_graph: False              # 是否在 RViz 中可视化同伦类图
  visualize_with_time_as_z_axis_scale: False  # 是否将时间轴映射为Z轴进行可视化

  # ===== 恢复行为 =====
  shrink_horizon_backup: True            # 是否在规划失败后收缩优化时域重试
  shrink_horizon_min_duration: 10        # 收缩后的最小时域长度
  oscillation_recovery: False            # 是否启用振荡检测与恢复
  oscillation_v_eps: 0.1                 # 振荡判定：线速度变化小于此值视为振荡，单位：m/s
  oscillation_omega_eps: 0.1             # 振荡判定：角速度变化小于此值视为振荡，单位：rad/s
  oscillation_recovery_min_duration: 10  # 振荡恢复最小持续时间
  oscillation_filter_duration: 10        # 振荡检测滤波窗口长度