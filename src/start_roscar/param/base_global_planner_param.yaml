#GlobalPlanner官方介绍：http://wiki.ros.org/global_planner

#全局路径规划器GlobalPlanner命名空间
GlobalPlanner:  
  #是否使用dijkstra算法进行路径规划，false则选择A*算法进行路径规划
  use_dijkstra: true

  #是否使用二次逼近法进行计算，false则使用更简单的计算方法
  use_quadratic: true

  #如果出于某种原因，您想要global_planner精确地反映navfn的行为，则将其设置为true(并为其他布尔参数使用默认值)                                
  old_navfn_behavior: false

  #是否发布Potential代价地图
  publish_potential: true

  #如果为true，创建一条遵循网格边界的路径。false，则使用梯度下降法。
  use_grid_path: false

  #是否允许路径穿过代价地图的未知区域
  allow_unknown:  true  

  #允许的创建的路径规划终点与设置目标点的偏差为多少，单位：m
  default_tolerance: 0.0

  #是否对通过PointCloud2计算出来的potential area进行可视化
  visualize_potential: false

  # --- 代价地图代价值设定 ---
  lethal_cost: 253             # 致命障碍物的代价值（通常为253，接近255视为完全占用）
  neutral_cost: 50             # 中性代价值，介于自由与障碍之间
  cost_factor: 3.0             # 代价因子，用于将代价地图值转换为路径规划的边代价

  # --- 路径点朝向设定 ---
  # 设置每个路径点朝向的方式：0=None, 1=Forward, 2=Interpolate, 3=ForwardThenInterpolate
  orientation_mode: 0
  # 根据 orientation_mode 指定的位置导数确定朝向时使用的窗口大小
  orientation_window_size: 1

  # --- 地图边界 ---
  # 用完全占用方格勾勒出全局代价地图轮廓。
  # 对于非 static_map（rolling_window）的全局代价地图，需要设置为 false
  outline_map: true